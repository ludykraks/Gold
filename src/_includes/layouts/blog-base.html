layout: layouts/studio.html

<article class="blog-article">
  <header class="shell blog-article-header">
    <p class="eyebrow">GoldChest guide</p>
    <h1>{{ title }}</h1>
    <p class="blog-article-meta"><time datetime="{{ (page | blogDate).toISOString() }}">{{ page | blogDate | readableBlogDate }}</time></p>
  </header>
  <div class="light-section">
    <div class="shell blog-article-layout">
      <div class="blog-prose">{{ content | safe }}</div>
      <aside class="blog-article-cta" aria-labelledby="article-cta-heading">
        <p class="eyebrow">Need practical help?</p>
        <h2 id="article-cta-heading">Let’s work on your next step.</h2>
        <p>Tell us what you want your website or digital presence to do better.</p>
        <a class="button button-dark" href="/start-a-project/">Start a project <span aria-hidden="true">↗</span></a>
      </aside>
    </div>
  </div>
</article>
